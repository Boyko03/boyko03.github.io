---
layout: base
---

<div class="home">
  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}

  <div style="display: flex; align-items: center; flex-direction: column;">
    <img src="{{ page.image }}" width="150px" height="150px" style="border-radius: 50%;" />
    <h1>{{ site.author.name }}</h1>
    <a href="mailto:{{ site.author.email }}"><h4>{{ site.author.email }}</h4></a>
  </div>

  {{ content }}

  {%- for lang in page.languages -%}
  {{ lang }}
  {%- endfor -%}

</div>
